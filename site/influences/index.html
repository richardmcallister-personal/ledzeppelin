<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Influences · Led Zeppelin</title>
<meta name="description" content="The artists who shaped Led Zeppelin, and the musicians Led Zeppelin shaped in turn.">
<meta property="og:title" content="Influences · Led Zeppelin">
<meta property="og:description" content="The artists who shaped Led Zeppelin, and the musicians Led Zeppelin shaped in turn.">
<meta property="og:image" content="/assets/social-preview.png">
<link rel="preload" href="/fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/d.css">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#202322">
<script>try{var t=localStorage.getItem("lz_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="/d.js"></script>
</head>
<body>
<main id="main" class="wrap">
  <div class="head"><h1>Influences</h1><p>The blues, folk and rock and roll that shaped the band, and some of the musicians they shaped in turn. Each link goes to the source.</p></div>
  <nav class="direction-nav" aria-label="Influence direction"><a href="#roots">Artists who influenced Led Zeppelin</a><a href="#legacy">Artists Led Zeppelin influenced</a></nav>
  <div id="connections"></div>
  <p id="status" role="status" class="loading">Loading…</p>
</main>
<script>
D.shell("influences");
(async () => {
  const [artists, pics] = await Promise.all([D.get("/data/influences.json"), D.get("/data/influence-images.json").catch(() => [])]);
  const has = new Set(pics);
  const face = (a) => {
    const k = D.slug(a.name);
    if (has.has(k)) return `<img src="/img/influences/${k}.webp" alt="" width="116" height="116" loading="lazy" decoding="async">`;
    const ini = a.name.replace(/['’]/g, "").split(/[\s&]+/).filter((w) => /^[A-Z]/.test(w)).slice(0, 2).map((w) => w[0]).join("");
    return `<span class="ph">${ini}</span>`;
  };
  const groups = [["roots", "Artists who influenced Led Zeppelin"], ["legacy", "Artists Led Zeppelin influenced"]];
  document.getElementById("connections").innerHTML = groups.map(([id, title]) =>
    `<section class="influence-group" id="${id}"><h2>${title}</h2><div class="influence-list">` +
    artists.filter((a) => a.direction === title).map((a) =>
      `<article id="artist-${D.slug(a.name)}"><div class="artist-heading"><a href="${D.esc(a.spotify)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">${face(a)}</a>` +
      `<div><h3>${D.esc(a.name)}</h3><a href="${D.esc(a.spotify)}" target="_blank" rel="noopener" aria-label="${D.esc("Listen to " + a.name + " on Spotify")}">Listen on Spotify</a></div></div>` +
      `<p>${D.esc(a.note)}</p><a class="src" href="${D.esc(a.source)}" target="_blank" rel="noopener">${D.esc(new URL(a.source).hostname.replace(/^www\./, ""))}</a></article>`).join("") +
    `</div></section>`).join("");
  document.getElementById("status").remove();
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
})().catch(() => { const s = document.getElementById("status"); s.classList.remove("loading"); s.textContent = "The influences could not load. Please reload the page."; });
</script>
</body>
</html>
