<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Setlist · Led Zeppelin</title>
<meta name="description" content="A Led Zeppelin setlist from setlist.fm.">
<meta property="og:title" content="Setlist · Led Zeppelin">
<meta property="og:description" content="A Led Zeppelin setlist from setlist.fm.">
<meta property="og:image" content="/assets/social-preview.png">
<link rel="preload" href="/fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/d.css">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#202322">
<script>try{var t=localStorage.getItem("lz_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="/d.js"></script>
</head>
<body>
<main id="main" class="wrap"><div class="loading">Loading…</div></main>
<script>
D.shell("concerts");
(async () => {
  const M = document.getElementById("main");
  const id = (D.qs("id") || "").replace(/[^a-z0-9]/gi, "");
  let s;
  try { s = await D.get(`/api/setlist?id=${id}`); } catch (e) {}
  if (!s || !s.id) {
    M.innerHTML = `<div class="head"><h1>Show not found</h1><p><a href="/concerts/">Browse all shows</a>.</p></div>`;
    return;
  }
  document.title = `${s.v}, ${D.date(s.d)} · Led Zeppelin`;
  const [songs, tour] = await Promise.all([D.get("/data/songs.json"), D.get("/data/tour-photos.json").catch(() => [])]);
  const pics = tour.filter((p) => p.d === s.d);
  const tours = await D.get("/data/tours.json").catch(() => []);
  const onTour = tours.find((t) => t.name === s.t);
  const art = (await D.get("/data/art.json").catch(() => ({ concerts: {} }))).concerts[s.id];
  const known = Object.fromEntries(songs.map((x) => [x.s, x]));
  const total = s.sets.reduce((t, x) => t + x.s.length, 0);
  let n = 0;
  const sets = s.sets.filter((x) => x.s.length).map((set, i) => {
    const label = set.e ? (set.e > 1 ? `Encore ${set.e}` : "Encore") : set.n || (s.sets.length > 1 ? `Set ${i + 1}` : "");
    const start = n; n += set.s.length;
    return `<div class="set">${label ? `<h3>${D.esc(label)}</h3>` : ""}<ol start="${start + 1}">` + set.s.map((x) => {
      const k = known[D.slug(x.n)];
      const extra = [x.c ? `${D.esc(x.c)} cover` : "", x.w ? `with ${D.esc(x.w)}` : "", x.i ? D.esc(x.i) : "", k && k.f[1] === s.id ? "<b>first performance</b>" : ""].filter(Boolean).join(" · ");
      return `<li>${k ? `<a href="/song/?s=${k.s}">${D.esc(x.n)}</a>` : D.esc(x.n)}${extra ? ` <span class="muted">(${extra})</span>` : ""}</li>`;
    }).join("") + `</ol></div>`;
  }).join("");
  M.innerHTML = `${art ? `<div class="showbanner"><img src="/img/${art}.webp" alt="" loading="eager"></div>` : ""}<div class="head"><span class="tag">${D.date(s.d, true)}</span>
      <h1 style="margin-top:8px">${D.esc(s.v)}</h1>
      <p>${D.esc(D.place(s))}${s.t ? " · " + D.esc(s.t) : ""}</p>
      ${onTour ? `<p><a class="btn" href="/tour/?t=${onTour.s}&n=${s.id}">Follow this tour on the map</a></p>` : ""}
      ${s.d < "1968-10-25" ? `<p class="small muted">Played before the name Led Zeppelin was used, billed as ${s.d < "1968-10-01" ? "the New Yardbirds" : "the Yardbirds"}. setlist.fm lists this show under <a href="${s.u}" rel="noopener">The Yardbirds</a>.</p>` : ""}</div>
    ${pics.length ? `<section class="sheet"><h2>Photos from this day</h2><div class="gal">${pics.map((p) => `<figure><a href="/img/tour/${p.s}.webp" target="_blank" rel="noopener"><img src="/img/tour/${p.s}-s.webp" alt="${D.esc(p.t)}" loading="lazy"></a><figcaption>${D.esc(p.t.replace(/\.$/, ""))}<small><a href="${p.src}" target="_blank" rel="noopener">ledzeppelin.com archive</a></small></figcaption></figure>`).join("")}</div></section>` : ""}
    <section class="sheet">
      <h2>Setlist <span class="muted small" style="font-family:var(--body);font-weight:400">${total ? total + " songs" : ""}</span></h2>
      ${sets || `<p class="empty">No setlist on record for this show${s.d >= D.today() ? " yet" : ""}.</p>`}
      <p class="small muted" style="margin-top:12px">Setlist from <a href="${s.u}" rel="noopener">setlist.fm</a>, where fans can correct and add details.</p>
    </section>
    <a class="more" href="/concerts/?y=${s.d.slice(0, 4)}">All ${s.d.slice(0, 4)} shows</a>`;
})();
</script>
</body>
</html>
