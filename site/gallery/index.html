<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gallery · Led Zeppelin</title>
<meta name="description" content="Led Zeppelin on stage, on the road and from the archive, 1968 to 1980.">
<meta property="og:title" content="Gallery · Led Zeppelin">
<meta property="og:description" content="Led Zeppelin on stage, on the road and from the archive, 1968 to 1980.">
<meta property="og:image" content="/assets/social-preview.png">
<link rel="preload" href="/fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/d.css">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#202322">
<script>try{var t=localStorage.getItem("lz_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="/d.js"></script>
</head>
<body>
<main id="main" class="wrap">
  <div class="head"><h1>Gallery</h1><p id="lede">On stage, on the road and from the archive, 1968 to 1980. Tap a picture to see it larger.</p></div>
  <div class="tools"><div class="chips" id="kinds" role="group" aria-label="Show"></div></div>
  <div class="gal" id="gal"><div class="loading">Loading…</div></div>
  <p class="small muted" style="margin-top:8px">Tour photographs from the image archive at <a href="https://www.ledzeppelin.com/" target="_blank" rel="noopener">ledzeppelin.com</a>; each links to its entry there. Where only a year is shown, the exact day is not known.</p>
</main>
<dialog class="photo" id="big" aria-label="Photo"></dialog>
<script>
D.shell("gallery");
(async () => {
  const [arch, tour] = await Promise.all([D.get("/data/gallery.json"), D.get("/data/tour-photos.json")]);
  const all = [
    ...tour.map((p) => ({ src: `/img/tour/${p.s}`, t: p.t.replace(/\.$/, ""), d: p.d, k: p.k, link: p.src })),
    ...arch.map((p) => ({ src: `/img/${p.s}`, t: p.t, d: p.d || "", k: "archive", when: true })),
  ].sort((a, b) => (a.d || "9999").localeCompare(b.d || "9999"));
  const when = (d) => !d ? "" : d.length === 4 ? d : D.date(d);
  const kinds = [["all", "All"], ["concert", "In concert"], ["road", "On the road"], ["archive", "Archive"]];
  let kind = D.qs("k") || "all";
  const K = document.getElementById("kinds");
  K.innerHTML = kinds.map(([k, l]) => `<button class="chip" type="button" data-k="${k}" aria-pressed="${k === kind}">${l}<span class="n">${k === "all" ? all.length : all.filter((p) => p.k === k).length}</span></button>`).join("");
  K.addEventListener("click", (e) => {
    const b = e.target.closest("[data-k]"); if (!b) return;
    kind = b.dataset.k;
    K.querySelectorAll("[data-k]").forEach((x) => x.setAttribute("aria-pressed", x === b));
    history.replaceState(null, "", kind === "all" ? location.pathname : "?k=" + kind);
    draw();
  });
  const G = document.getElementById("gal");
  let shown = [];
  const cap = (p) => `${D.esc(p.t)}${p.when && p.d ? `<small>${when(p.d)}</small>` : ""}`;
  function draw() {
    shown = all.filter((p) => kind === "all" || p.k === kind);
    G.innerHTML = shown.map((p, i) => `<figure><button type="button" data-i="${i}" aria-label="Enlarge: ${D.esc(p.t)}"><img src="${p.src}-s.webp" alt="${D.esc(p.t)}" loading="lazy" decoding="async"></button>
      <figcaption>${cap(p)}${p.link ? `<small><a href="${p.link}" target="_blank" rel="noopener">ledzeppelin.com archive</a></small>` : ""}</figcaption></figure>`).join("");
  }
  draw();
  const dlg = document.getElementById("big");
  G.addEventListener("click", (e) => {
    const b = e.target.closest("[data-i]"); if (!b) return;
    const p = shown[+b.dataset.i];
    dlg.innerHTML = `<img src="${p.src}.webp" alt="${D.esc(p.t)}"><p>${D.esc(p.t)}${p.when && p.d ? " · " + when(p.d) : ""}</p>`;
    dlg.showModal();
  });
  dlg.addEventListener("click", () => dlg.close());
})();
</script>
</body>
</html>
